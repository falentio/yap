<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f2ede4"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9cfbe"/>
      <stop offset="100%" stop-color="#bfb2a0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd9a0"/>
      <stop offset="20%" stop-color="#e8912f"/>
      <stop offset="100%" stop-color="#b96609"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8912f" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e8912f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- soft ambient wash -->
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff" opacity="0.35"/>

  <!-- glow behind the hero bottle -->
  <ellipse cx="880" cy="520" rx="360" ry="300" fill="url(#glow)"/>

  <!-- shelf plank -->
  <rect x="120" y="700" width="1360" height="34" rx="6" fill="url(#shelf)"/>
  <rect x="150" y="734" width="1300" height="12" rx="4" fill="#a89a86" opacity="0.55"/>

  <!-- ============ D/E tier: faded, shorter, cool grey-blue ============ -->
  <!-- D1 -->
  <g opacity="0.55">
    <rect x="196" y="560" width="92" height="140" rx="26" fill="#8d97a6"/>
    <rect x="196" y="560" width="92" height="140" rx="26" fill="url(#glass)"/>
    <rect x="214" y="532" width="56" height="32" rx="9" fill="#6f7887"/>
    <rect x="196" y="620" width="92" height="46" fill="#ffffff" opacity="0.30"/>
  </g>
  <!-- D2 -->
  <g opacity="0.55">
    <rect x="308" y="590" width="84" height="110" rx="24" fill="#9aa3b0"/>
    <rect x="308" y="590" width="84" height="110" rx="24" fill="url(#glass)"/>
    <rect x="324" y="564" width="52" height="30" rx="8" fill="#7b8494"/>
    <rect x="308" y="640" width="84" height="34" fill="#ffffff" opacity="0.28"/>
  </g>

  <!-- ============ C tier: cool slate blue, spray can shapes ============ -->
  <g opacity="0.78">
    <!-- C1 spray can -->
    <rect x="430" y="470" width="104" height="230" rx="18" fill="#6b7f96"/>
    <rect x="430" y="470" width="104" height="230" rx="18" fill="url(#glass)"/>
    <rect x="474" y="446" width="16" height="28" rx="5" fill="#4d5f74"/>
    <rect x="452" y="430" width="60" height="20" rx="6" fill="#8496ab"/>
    <rect x="430" y="560" width="104" height="70" fill="#ffffff" opacity="0.22"/>
    <!-- C2 spray can, taller -->
    <rect x="560" y="500" width="96" height="200" rx="16" fill="#5f7189"/>
    <rect x="560" y="500" width="96" height="200" rx="16" fill="url(#glass)"/>
    <rect x="600" y="478" width="16" height="26" rx="5" fill="#455668"/>
    <rect x="580" y="462" width="56" height="18" rx="6" fill="#7d8fa5"/>
    <rect x="560" y="580" width="96" height="60" fill="#ffffff" opacity="0.20"/>
  </g>

  <!-- ============ B tier: teal, medium height ============ -->
  <g opacity="0.92">
    <rect x="690" y="430" width="112" height="270" rx="30" fill="#3f7d78"/>
    <rect x="690" y="430" width="112" height="270" rx="30" fill="url(#glass)"/>
    <rect x="712" y="398" width="68" height="38" rx="11" fill="#2f625f"/>
    <rect x="690" y="500" width="112" height="86" fill="#ffffff" opacity="0.24"/>
    <rect x="690" y="616" width="112" height="44" fill="#ffffff" opacity="0.14"/>

    <rect x="826" y="462" width="104" height="238" rx="28" fill="#488a83"/>
    <rect x="826" y="462" width="104" height="238" rx="28" fill="url(#glass)"/>
    <rect x="846" y="432" width="64" height="36" rx="10" fill="#356e69"/>
    <rect x="826" y="530" width="104" height="70" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- ============ S tier: the hero, warm amber, tallest, front ============ -->
  <g>
    <!-- cast shadow -->
    <ellipse cx="1035" cy="702" rx="120" ry="16" fill="#b96609" opacity="0.22"/>
    <!-- hero bottle -->
    <rect x="960" y="352" width="150" height="348" rx="40" fill="url(#amber)"/>
    <rect x="960" y="352" width="150" height="348" rx="40" fill="url(#glass)"/>
    <!-- cap -->
    <rect x="996" y="300" width="78" height="58" rx="18" fill="#8a4c06"/>
    <rect x="996" y="300" width="78" height="58" rx="18" fill="url(#glass)"/>
    <!-- label band -->
    <rect x="960" y="450" width="150" height="120" fill="#ffffff" opacity="0.32"/>
    <!-- specular highlight -->
    <rect x="982" y="380" width="16" height="250" rx="8" fill="#ffffff" opacity="0.34"/>
  </g>

  <!-- second S-tier, similar family -->
  <g>
    <rect x="1130" y="440" width="126" height="260" rx="34" fill="#e8912f" opacity="0.86"/>
    <rect x="1130" y="440" width="126" height="260" rx="34" fill="url(#glass)"/>
    <rect x="1150" y="404" width="86" height="44" rx="13" fill="#a2580a"/>
    <rect x="1130" y="512" width="126" height="76" fill="#ffffff" opacity="0.26"/>
  </g>

  <!-- ============ A tier: soft sage/green-grey ============ -->
  <g opacity="0.95">
    <rect x="1276" y="486" width="106" height="214" rx="28" fill="#7d9682"/>
    <rect x="1276" y="486" width="106" height="214" rx="28" fill="url(#glass)"/>
    <rect x="1296" y="456" width="66" height="36" rx="10" fill="#62796a"/>
    <rect x="1276" y="552" width="106" height="62" fill="#ffffff" opacity="0.24"/>

    <rect x="1402" y="520" width="92" height="180" rx="26" fill="#8ea395"/>
    <rect x="1402" y="520" width="92" height="180" rx="26" fill="url(#glass)"/>
    <rect x="1418" y="494" width="60" height="32" rx="9" fill="#70886f"/>
    <rect x="1402" y="580" width="92" height="52" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- floor reflection strip -->
  <rect x="120" y="746" width="1360" height="26" fill="#c9bfae" opacity="0.28"/>
</svg>